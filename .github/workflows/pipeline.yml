name: curation

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC: collect + classify
    - cron: "41 4 * * 1"   # Monday 04:41 UTC (05:41 Paris): collect + classify + digest
  workflow_dispatch:
    inputs:
      digest:
        description: "Also build the digest"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: curation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect feeds
        run: python -m vsp collect

      - name: Classify new stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m vsp classify

      - name: Build digest
        if: github.event.schedule == '41 4 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.digest)
        run: python -m vsp digest

      - name: Commit database and digest
        if: always()   # keep collected stories even if classification failed
        run: |
          git config user.name "curation-bot"
          git config user.email "curation-bot@users.noreply.github.com"
          git add data/vsp.duckdb docs/
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "curation: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
